<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SANAV SOFTWARE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0d3b66;
            --accent-gold: #c9a86a;
            --dark-bg: #0a1929;
            --card-bg: #132f4c;
            --text-light: #f0f7ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(201, 168, 106, 0.2);
        }

        .login-card h2 {
            text-align: center;
            color: var(--accent-gold);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201, 168, 106, 0.3);
            border-radius: 50px;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-gold);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-gold);
            color: var(--dark-bg);
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(201, 168, 106, 0.4);
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        .server-status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4d4d;
        }

        .status-dot.online {
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        .status-text {
            color: #aaa;
        }

        .status-text.online {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login Now</button>
        </form>
        <div class="links">
            <p>Back to <a href="index.html">Home</a></p>
        </div>
        <div class="server-status" id="serverStatus">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Checking Backend...</span>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // IMPROVED BASE URL LOGIC
        const getBaseUrl = () => {
            const host = window.location.hostname === 'localhost' ? '127.0.0.1' : (window.location.hostname || '127.0.0.1');
            return `http://${host}:8080/api`;
        };

        // Function to check backend health
        async function checkServerStatus() {
            const baseUrl = getBaseUrl();
            try {
                const response = await fetch(`${baseUrl}/home`, { method: 'GET', mode: 'cors' });
                if (response.ok || response.status === 401 || response.status === 403) {
                    statusDot.classList.add('online');
                    statusText.classList.add('online');
                    statusText.innerText = 'Backend Online (Port 8080)';
                    return true;
                }
            } catch (err) {
                try {
                    const fallbackResponse = await fetch(`http://localhost:8080/api/home`, { method: 'GET', mode: 'cors' });
                    if (fallbackResponse.ok || fallbackResponse.status === 401) {
                         statusDot.classList.add('online');
                         statusText.classList.add('online');
                         statusText.innerText = 'Backend Online (Localhost)';
                         return true;
                    }
                } catch (e) {}
            }
            statusDot.classList.remove('online');
            statusText.classList.remove('online');
            statusText.innerText = 'Backend Offline (Check Port 8080)';
            return false;
        }

        checkServerStatus();
        setInterval(checkServerStatus, 5000);

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.innerText = 'Verifying...';
            loginBtn.disabled = true;

            const urlsToTry = [
                `${getBaseUrl()}/auth/admin-login`,
                `http://127.0.0.1:8080/api/auth/admin-login`,
                `http://localhost:8080/api/auth/admin-login`
            ];

            let lastError = null;
            let success = false;

            for (const url of urlsToTry) {
                try {
                    console.log("Attempting login via:", url);
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        const loginData = result.data;
                        localStorage.setItem('token', loginData.token);
                        localStorage.setItem('user', JSON.stringify(loginData.user));
                        localStorage.setItem('adminName', loginData.user.name || 'Admin');
                        localStorage.setItem('adminEmail', loginData.user.email);
                        
                        success = true;
                        alert('Login successful! Redirecting to admin dashboard...');
                        window.location.href = 'admin.html';
                        break;
                    } else {
                        throw new Error(result.message || 'Invalid credentials');
                    }
                } catch (error) {
                    console.error(`Failed attempt for ${url}:`, error.message);
                    lastError = error;
                    if (error.message !== 'Failed to fetch' && !error.message.includes('network')) {
                        break;
                    }
                }
            }

            if (!success) {
                let errorMsg = 'Login Failed!';
                if (lastError.message === 'Failed to fetch' || lastError.message.includes('NetworkError')) {
                    errorMsg = "Multiple connection attempts failed.\n\n" +
                               "1. Verify Spring Boot is RUNNING on port 8080\n" +
                               "2. Verify MySQL database is active\n" +
                               "3. Check for CORS blocks in browser console";
                } else {
                    errorMsg = lastError.message;
                }
                alert(errorMsg);
                loginBtn.innerText = 'Login Now';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
